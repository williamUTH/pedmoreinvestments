<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You – Pedmore Investments</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body
    style="
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    "
  >
    <main style="max-width: 720px; text-align: center">
      <h1>Thank you</h1>
      <p>Your message has been sent. We will get back to you shortly.</p>
      <p>
        <a href="/" style="display: inline-block; margin-top: 16px"
          >Return to homepage</a
        >
      </p>
      <script>
        (function () {
          try {
            var params = new URLSearchParams(window.location.search);
            if (params.get("status") === "error") {
              var p = document.createElement("p");
              p.style.color = "#c00";
              p.textContent =
                "There was an issue sending your message. Please email jay@pedmoreinvestments.co.uk.";
              document.querySelector("main").appendChild(p);
            }
          } catch (e) {}
        })();
      </script>
    </main>
  </body>
</html>
